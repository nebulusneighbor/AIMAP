<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>CrowdForge - Live Voting</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .param-section { display: none; text-align: left; animation: fadeIn 0.5s; padding: 1rem; margin-bottom: 1rem; background: rgba(0,0,0,0.2); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .param-section.active { display: block; }
        
        .vote-btn {
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 2.5rem;
            border-radius: 12px;
            font-size: 2rem;
            font-weight: 700;
            width: 100%;
            margin-bottom: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            text-align: center;
        }
        .vote-btn:hover { border-color: var(--secondary-color); box-shadow: var(--accent-glow); }
        .vote-btn.selected { background: var(--primary-color); color: #0f172a; border-color: var(--primary-color); }
        
        .round-title { font-size: 1.5rem; text-align: center; margin-bottom: 1rem; color: var(--secondary-color); }
        .veto-btn { position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .veto-progress { position: absolute; bottom: 0; left: 0; height: 5px; background: var(--primary-color); width: 0%; transition: width 0.3s; }
        .veto-text { z-index: 1; }
        .veto-count { z-index: 1; font-size: 0.8rem; opacity: 0.7; margin-top: 5px; }

        
        @keyframes flashGreen {
            0% { box-shadow: inset 0 0 200px rgba(16, 185, 129, 1); background-color: rgba(16, 185, 129, 0.6); }
            100% { box-shadow: inset 0 0 0 rgba(16, 185, 129, 0); background-color: transparent; }
        }
        body.flash { animation: flashGreen 3s ease-out; }
    
        select {
            padding: 1.5rem;
            font-size: 1.5rem;
            border-radius: 12px;
            background: rgba(0,0,0,0.5);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            width: 100%;
        }
        /* App shell: timer bar on top, emoji bar at the bottom, only the middle
           scrolls. The document itself never scrolls, so neither bar can slide away. */
        html, body { height: 100%; }
        body {
            height: 100vh;
            height: 100dvh;
            min-height: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: flex-start;
            overflow: hidden;
        }
        .live-header {
            position: relative;
            top: auto;
            flex: none;
            margin: 0;
            border-radius: 0;
            padding: calc(0.6rem + env(safe-area-inset-top)) 1rem 0.6rem;
            justify-content: center;
            gap: 1.25rem;
        }
        .login-container {
            flex: 1 1 auto;
            min-height: 0;
            max-height: none;
            width: calc(100% - 1.5rem);
            align-self: center;
            margin: 0.75rem 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }
        .countdown-timer { font-size: 2.6rem; font-weight: 900; color: var(--primary-color); line-height: 1; }
        /* Between rounds the top bar becomes the "next round" countdown */
        .timer-label { display: none; font-size: 1.2rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: #fbbf24; }
        .live-header.is-break { background: rgba(251, 191, 36, 0.12); border-bottom-color: rgba(251, 191, 36, 0.4); }
        .live-header.is-break .timer-label { display: block; }
        .live-header.is-break .countdown-timer { color: #fbbf24; }
        .live-header.is-break .live-standings { display: none; }
        #vetoContainer h3 { font-size: 1.5rem !important; }
        #vetoContainer p { font-size: 1.2rem !important; }

        #param_container {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        /* Separate boxes for musical vs visual parameters */
        .param-group {
            border: 2px solid var(--group-border);
            background: var(--group-bg);
            border-radius: 16px;
            padding: 1rem;
            text-align: left;
        }
        .param-group.audio  { --group-color: #c084fc; --group-border: rgba(192, 132, 252, 0.5); --group-bg: rgba(192, 132, 252, 0.08); }
        .param-group.visual { --group-color: #00f2fe; --group-border: rgba(0, 242, 254, 0.45); --group-bg: rgba(0, 242, 254, 0.06); }
        .param-group-label {
            color: var(--group-color);
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.75rem;
        }
        .param-group-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            align-items: stretch;
        }
        .param-group .vote-btn:hover { border-color: var(--group-color); box-shadow: 0 0 20px var(--group-border); }
        .param-group .vote-btn.selected { background: var(--group-color); border-color: var(--group-color); color: #0f172a; }
        #vetoDropdownsList .param-group-grid { grid-template-columns: 1fr; gap: 10px; }

        /* Emoji reaction bar, always available (even while votes are locked) */
        .reaction-bar {
            position: relative;
            flex: none;
            z-index: 150;
            display: flex;
            justify-content: center;
            gap: 1rem;
            padding: 0.75rem 1rem calc(0.75rem + env(safe-area-inset-bottom));
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .reaction-btn {
            font-size: 1.9rem;
            width: 3.6rem; height: 3.6rem;
            padding: 0;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.06);
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.1s;
        }
        .reaction-btn:active { transform: scale(0.85); }
        .reaction-float {
            position: fixed;
            bottom: 5.5rem;
            font-size: 2.5rem;
            pointer-events: none;
            z-index: 160;
            animation: reactionRise 1.4s ease-out forwards;
        }
        @keyframes reactionRise {
            from { transform: translateY(0) scale(0.6); opacity: 1; }
            to   { transform: translateY(-40vh) scale(1.3); opacity: 0; }
        }

        /* Larger, more readable text for phones */
        .param-group-label { font-size: 1.25rem; }
        .param-section h3 { font-size: 1.4rem; }
        #questionTitle { font-size: 1.6rem !important; }
        .vote-status { font-size: 1.15rem; }
        .live-standings { font-size: 1.15rem; }
        .standing-item { padding: 0.4rem 0.8rem; }
        .param-section { margin-bottom: 0 !important; }
        .param-section.active { display: flex !important; flex-direction: column; }
        
        .vote-btn {
            white-space: normal;
            word-wrap: break-word;
            line-height: 1.2;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.1rem 0.75rem !important;
            font-size: 1.35rem !important;
        }
</style>
</head>
<body>
    <div class="dots"></div>
    
    <div class="freeze-overlay" id="freezeOverlay">
        <div class="freeze-message" id="freezeMsg">⏳ Time's up — votes locked, waiting for results.</div>
    </div>
    
    <div class="live-header" id="liveHeader" style="display: none;">
        <div class="timer-label">Next round in</div>
        <div class="countdown-timer" id="countdown">00:00</div>
        <div class="live-standings" id="liveStandings"></div>
    </div>

    <div class="login-container" style="max-width: 760px; padding: 1rem;">
        <div id="waitingScreen" style="display: block; text-align: center;">
            <h2 id="waitTitle" style="display: none; color: var(--secondary-color); margin-bottom: 1rem;">Waiting for next round...</h2>
            <h1 id="waitCountdown" style="display: none; font-size: 3rem; color: var(--primary-color); font-weight: 900; margin-bottom: 2rem;"></h1>
            
            <div style="background: rgba(255,255,255,0.05); padding: 1.5rem; border-radius: 16px; text-align: left; max-width: 520px; margin: 0 auto;">
                <h3 style="color: rgba(255,255,255,0.5); text-transform: uppercase; font-size: 1rem; margin-bottom: 1rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.5rem;">Current Performance State</h3>
                <div id="currentStateGrid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 1.2rem;">
                </div>
            </div>
        </div>

        <form id="voteForm" style="display: none;">
            <h1 id="questionTitle" style="font-size: 1.8rem; margin-bottom: 0.5rem; text-align: center;">Round</h1>
            <p style="text-align: center; color: #a1a1aa; margin-bottom: 1.25rem; font-size: 1.2rem;">Vote on each parameter below.</p>
            
            <div id="param_container"></div>

            <span class="vote-status" id="voteStatus" style="text-align: center; margin-top: 1rem; display: block;">🗳️ your vote is live — change it anytime</span>
            
            
        </form>
<div id="vetoContainer" style="margin-top: 2rem; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.1); display: none;">
                <h3 style="text-align: center; color: var(--secondary-color); margin-bottom: 1rem; font-size: 1rem; text-transform: uppercase;">Change Previous Parameters</h3>
                <p style="text-align: center; color: #a1a1aa; font-size: 0.8rem; margin-bottom: 1rem;">Select a new value to cast a veto vote.</p>
                <div id="vetoDropdownsList" style="display: flex; flex-direction: column; gap: 10px;">
                    <!-- Dropdowns populated dynamically -->
                </div>
            </div>
    </div>

    <div class="reaction-bar" id="reactionBar">
        <button type="button" class="reaction-btn" data-emoji="❤️">❤️</button>
        <button type="button" class="reaction-btn" data-emoji="🔥">🔥</button>
        <button type="button" class="reaction-btn" data-emoji="👏">👏</button>
        <button type="button" class="reaction-btn" data-emoji="🤘">🤘</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentRoundParams = [];
        const form = document.getElementById("voteForm");
        const waitingScreen = document.getElementById("waitingScreen");
        const header = document.getElementById("liveHeader");
        const overlay = document.getElementById("freezeOverlay");
        const paramContainer = document.getElementById("param_container");

        // Definitions for the dynamic parameters
        const paramNames = { genre: "Musical Feel", environment: "Environment", humanGuitarTone: "Guitar Tone", character_skin: "Character Skin", instruments: "Instruments", dance_moves: "Dance Moves", tempo: "Tempo" };
        const parameterDefinitions = {
            "genre": {
                title: "🎵 Musical Feel",
                options: [
                    {val: "drive/rock", label: "Drive / Rock"},
                    {val: "pulse/hiphop", label: "Pulse / HipHop"},
                    {val: "groove/funky", label: "Groove / Funky"},
                    {val: "elegant/atmospheric", label: "Elegant / Atmos"}
                ]
            },
            "environment": {
                title: "🌌 Environment",
                options: [
                    {val: "haunted forest", label: "Haunted Forest"},
                    {val: "mars scape", label: "Mars Scape"},
                    {val: "laser grid", label: "Laser Grid"}
                ]
            },
            "humanGuitarTone": {
                title: "🎸 Guitar Tone",
                options: [
                    {val: "clean", label: "Clean / Chorus"},
                    {val: "crunch", label: "Crunch / Distorted"},
                    {val: "ambient", label: "Ambient / Airy"}
                ]
            },
            "character_skin": {
                title: "👾 Band & Dancers Skin",
                options: [
                    {val: "monsters", label: "Monsters"},
                    {val: "robots", label: "Robots"},
                    {val: "aliens", label: "Aliens"}
                ]
            },
            "instruments": {
                title: "🥁 Instrumentation Presence",
                options: [
                    {val: "full", label: "Full Band (All)"},
                    {val: "rhythm", label: "Rhythm Section (Drums+Bass)"},
                    {val: "acoustic", label: "Acoustic (Piano+Strings)"}
                ]
            },
            "dance_moves": {
                title: "🕺 Dance Style",
                options: [
                    {val: "hiphop", label: "Hip Hop"},
                    {val: "breakdance", label: "Breakdance"},
                    {val: "latin", label: "Latin"}
                ,
                    {val: "drink", label: "Drink"}]
            },
            "tempo": {
                title: "⏱️ Tempo",
                options: [
                    {val: "90", label: "90 BPM"},
                    {val: "110", label: "110 BPM"},
                    {val: "130", label: "130 BPM"},
                    {val: "150", label: "150 BPM"},
                    {val: "170", label: "170 BPM"}
                ]
            }
        };

        const paramGroups = {
            audio:  { label: "🎵 Music",  params: ["genre", "humanGuitarTone", "instruments", "tempo"] },
            visual: { label: "🌌 Visual", params: ["environment", "character_skin", "dance_moves"] }
        };

        // Builds one labelled box per group (only for groups that have params) and
        // returns a map of group key -> grid element to append items into.
        function buildGroupBoxes(container, params) {
            const grids = {};
            Object.entries(paramGroups).forEach(([key, g]) => {
                if (!params.some(p => g.params.includes(p))) return;
                const box = document.createElement('div');
                box.className = 'param-group ' + key;
                const label = document.createElement('div');
                label.className = 'param-group-label';
                label.textContent = g.label;
                const grid = document.createElement('div');
                grid.className = 'param-group-grid';
                box.appendChild(label);
                box.appendChild(grid);
                container.appendChild(box);
                grids[key] = grid;
            });
            return grids;
        }

        function groupOf(p) {
            return Object.keys(paramGroups).find(k => paramGroups[k].params.includes(p));
        }

        function renderParams(params) {
            paramContainer.innerHTML = '';
            const grids = buildGroupBoxes(paramContainer, params);
            params.forEach(p => {
                const def = parameterDefinitions[p];
                if (!def) return;
                const grid = grids[groupOf(p)];
                if (!grid) return;

                const section = document.createElement('div');
                section.className = 'param-section active';
                section.dataset.param = p;
                
                const title = document.createElement('h3');
                title.textContent = def.title;
                title.style.marginBottom = '10px';
                title.style.color = 'white';
                section.appendChild(title);
                
                const hiddenInput = document.createElement('input');
                hiddenInput.type = 'hidden';
                hiddenInput.id = 'input_' + p;
                section.appendChild(hiddenInput);
                
                def.options.forEach(opt => {
                    const btn = document.createElement('div');
                    btn.className = 'vote-btn';
                    btn.textContent = opt.label;
                    btn.dataset.val = opt.val;
                    btn.addEventListener('click', function() {
                        section.querySelectorAll('.vote-btn').forEach(b => b.classList.remove('selected'));
                        this.classList.add('selected');
                        hiddenInput.value = this.dataset.val;
                        sendVote();
                    });
                    section.appendChild(btn);
                });
                
                grid.appendChild(section);
            });
        }

        function sendVote() {
            if (!currentRoundParams || currentRoundParams.length === 0) return;
            const votes = {};
            currentRoundParams.forEach(p => {
                const val = document.getElementById(`input_${p}`)?.value;
                if (val) {
                    votes[p] = val;
                }
            });
            if (Object.keys(votes).length > 0) {
                socket.emit("vote_update", { votes });
                updateVoteStatus();
            }
        }

        document.querySelectorAll('.reaction-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                socket.emit("reaction", { emoji: btn.dataset.emoji });
                // Local echo so the tap feels responsive
                const rect = btn.getBoundingClientRect();
                const el = document.createElement('div');
                el.className = 'reaction-float';
                el.textContent = btn.dataset.emoji;
                el.style.left = (rect.left + rect.width / 2 - 20 + (Math.random() * 30 - 15)) + 'px';
                document.body.appendChild(el);
                el.addEventListener('animationend', () => el.remove());
            });
        });

        socket.on("redirect_clients", d => window.location.href = d.page);
        socket.on("results_ready", () => window.location.href = "/");

        
        
        let countdownInterval;
        let serverTimeOffset = 0;
        socket.on("phase_change", state => {
            header.classList.toggle('is-break', state.phase === 'break');
            if (state.serverNow) {
                serverTimeOffset = Date.now() - state.serverNow;
            }
            if (state.global_state) {
                const s = state.global_state;
                const grid = document.getElementById('currentStateGrid');
                if (grid) {
                    grid.innerHTML = '';
                    const lockable = ['genre', 'environment', 'humanGuitarTone', 'character_skin', 'instruments', 'dance_moves', 'tempo'];
                    lockable.forEach(p => {
                        if (s[p] !== undefined && s[p] !== null) {
                            grid.innerHTML += `<div style="color: rgba(255,255,255,0.7);">${paramNames[p] || p}:</div><div style="font-weight: bold; color: white;">${s[p]}</div>`;
                        }
                    });
                }
            }

            if (state.phase === "results" || state.phase === "lobby" || state.phase === "break") {
                waitingScreen.style.display = "block";
                form.style.display = "none";
                header.style.display = "flex";
                overlay.style.display = "none";
                
                // The between-rounds countdown is only meaningful during a break
                // The top bar shows the between-rounds countdown; no second timer in the card
                document.getElementById('waitTitle').style.display = "none";
                document.getElementById('waitCountdown').style.display = "none";
                if (state.phase === "break") {
                    document.getElementById('waitTitle').textContent = "Next round in...";
                } else {
                    document.getElementById('waitTitle').textContent = "Waiting for next round...";
                    document.getElementById('waitCountdown').textContent = "";
                    clearInterval(countdownInterval);
                }
            }

            const incomingParams = Array.isArray(state.current_question) ? state.current_question : (state.current_question ? [state.current_question] : []);
            
            // Check if parameters changed (new round)
            const paramsChanged = JSON.stringify(incomingParams) !== JSON.stringify(currentRoundParams);
            
            if (state.phase === "active" && paramsChanged) {
                document.body.classList.remove('flash');
                void document.body.offsetWidth; // trigger reflow
                document.body.classList.add('flash');
                
                currentRoundParams = incomingParams;
                renderParams(currentRoundParams);
            }
            
            if (incomingParams && incomingParams.length > 0) {
                let rTitle = incomingParams.map(p => paramNames[p] || p).join(" & ").toUpperCase();
                document.getElementById("questionTitle").textContent = rTitle;
            }
            
            const vetoList = document.getElementById('vetoDropdownsList');
            if (vetoList) {
                // We shouldn't wipe out the whole container if we can help it to preserve selections,
                // but for simplicity we will rebuild it. We'll store user selections first.
                const userSelections = {};
                vetoList.querySelectorAll('select').forEach(sel => userSelections[sel.dataset.param] = sel.value);
                
                vetoList.innerHTML = '';
                
                if (state.global_state) {  // Always show veto options if global_state exists
                    const lockable = ['genre', 'environment', 'humanGuitarTone', 'character_skin', 'instruments', 'dance_moves', 'tempo'];
                    let anyVisible = false;
                    const isVetoable = p => state.global_state[p] !== undefined && state.global_state[p] !== null && (!incomingParams || !incomingParams.includes(p));
                    const vetoGrids = buildGroupBoxes(vetoList, lockable.filter(isVetoable));
                    lockable.forEach(p => {
                        if (isVetoable(p)) {
                            anyVisible = true;
                            const def = parameterDefinitions[p] || { title: p, options: [] };
                            
                            const selContainer = document.createElement('div');
                            selContainer.style.background = 'rgba(0,0,0,0.3)';
                            selContainer.style.padding = '14px';
                            selContainer.style.borderRadius = '8px';
                            selContainer.style.border = '1px solid rgba(255,255,255,0.1)';
                            
                            const label = document.createElement('div');
                            label.style.fontSize = '1.15rem';
                            label.style.color = 'var(--secondary-color)';
                            label.style.marginBottom = '5px';
                            label.textContent = paramNames[p] || p;
                            
                            const select = document.createElement('select');
                            select.dataset.param = p;
                            select.className = 'veto-value-select';
                            select.style.width = '100%';
                            select.style.padding = '0.9rem';
                            select.style.fontSize = '1.2rem';
                            select.style.background = 'rgba(15,23,42,0.8)';
                            select.style.color = 'white';
                            select.style.border = '1px solid rgba(255,255,255,0.2)';
                            select.style.borderRadius = '4px';
                            
                            const defaultOpt = document.createElement('option');
                            defaultOpt.value = "";
                            let currentLabel = state.global_state[p] || 'None';
                            if (p === 'tempo' && state.global_state[p]) { currentLabel = currentLabel + " BPM"; }
                            else {
                                const matchingDef = def.options.find(o => o.val === state.global_state[p]);
                                if (matchingDef) currentLabel = matchingDef.label;
                            }
                            defaultOpt.textContent = `-- Keep Current (${currentLabel}) --`;
                            select.appendChild(defaultOpt);
                            
                            if (p === 'tempo') {
                                // For tempo, maybe just a few discrete choices for veto, or we skip tempo veto.
                                // Let's give them standard choices
                                [90, 110, 130, 150, 170].forEach(t => {
                                    if (state.global_state[p] != t) {
                                        const o = document.createElement('option');
                                        o.value = t;
                                        o.id = `veto_opt_${p}_${t}`;
                                        o.textContent = `${t} BPM (0 votes)`;
                                        select.appendChild(o);
                                    }
                                });
                            } else {
                                def.options.forEach(opt => {
                                    if (opt.val !== state.global_state[p]) {
                                        const o = document.createElement('option');
                                        o.value = opt.val;
                                        o.id = `veto_opt_${p}_${opt.val.replace(/[^a-zA-Z0-9]/g,'_')}`;
                                        o.textContent = `${opt.label} (0 votes)`;
                                        select.appendChild(o);
                                    }
                                });
                            }
                            
                            if (userSelections[p]) select.value = userSelections[p];
                            
                            select.addEventListener('change', (e) => {
                                socket.emit("veto_value_vote", { parameter: p, value: e.target.value });
                                const status = document.getElementById("voteStatus");
                                status.innerHTML = "🗳️ Veto cast!";
                                status.classList.add("show");
                                
                                setTimeout(() => { status.innerHTML = "🗳️ your vote is live — change it anytime"; status.classList.remove("show"); }, 2000);
                            });
                            
                            selContainer.appendChild(label);
                            selContainer.appendChild(select);
                            (vetoGrids[groupOf(p)] || vetoList).appendChild(selContainer);
                        }
                    });
                    document.getElementById('vetoContainer').style.display = anyVisible ? 'block' : 'none';
                } else {
                    document.getElementById('vetoContainer').style.display = 'none';
                }
            }

            if (state.phase === "active") {
                waitingScreen.style.display = "none";
                form.style.display = "block";
                header.style.display = "flex";
                overlay.style.display = "none";
                form.style.pointerEvents = "auto";
                form.style.opacity = "1";
            } else if (state.phase === "frozen") {
                overlay.style.display = "flex";
                form.style.pointerEvents = "none";
            }
            
            clearInterval(countdownInterval);
            if (state.deadline && (state.phase === "active" || state.phase === "frozen" || state.phase === "break")) {
                const updateTime = () => {
                    const diff = Math.max(0, state.deadline - (Date.now() - serverTimeOffset));
                    const seconds = Math.ceil(diff / 1000);
                    const m = Math.floor(seconds / 60).toString().padStart(2, '0');
                    const s = (seconds % 60).toString().padStart(2, '0');
                    if (state.phase === 'break') {
                        const waitEl = document.getElementById('waitCountdown');
                        if (waitEl) waitEl.textContent = `${m}:${s}`;
                        // Keep the pinned timer bar in sync during the break too
                        const el = document.getElementById("countdown");
                        if (el) {
                            el.textContent = `${m}:${s}`;
                            el.classList.remove("urgent", "urgent-pulse");
                        }
                    } else {
                        const el = document.getElementById("countdown");
                        if(el) {
                            el.textContent = `${m}:${s}`;
                            if (seconds <= 10 && seconds > 0 && state.phase === "active") {
                                el.classList.add("urgent");
                                el.classList.remove("urgent-pulse");
                                void el.offsetWidth;
                                el.classList.add("urgent-pulse");
                            } else {
                                el.classList.remove("urgent");
                                el.classList.remove("urgent-pulse");
                            }
                        }
                    }
                    if (diff <= 0) clearInterval(countdownInterval);
                };
                updateTime();
                countdownInterval = setInterval(updateTime, 1000);
            }
        });

        
        let lastVetoThreshold = 1;
        socket.on("veto_distribution", dists => {
            // Re-label options
            for (let p in dists) {
                const pDist = dists[p];
                for (let val in pDist) {
                    const safeVal = val.toString().replace(/[^a-zA-Z0-9]/g,'_');
                    const opt = document.getElementById(`veto_opt_${p}_${safeVal}`);
                    if (opt) {
                        const baseLabel = opt.textContent.split('(')[0].trim();
                        opt.textContent = `${baseLabel} (${pDist[val]} votes)`;
                    }
                }
                
                // Reset any options that have 0 votes
                const selects = document.querySelectorAll(`select[data-param="${p}"]`);
                if (selects.length > 0) {
                    Array.from(selects[0].options).forEach(opt => {
                        if (opt.value !== "" && !pDist[opt.value]) {
                            const baseLabel = opt.textContent.split('(')[0].trim();
                            opt.textContent = `${baseLabel} (0 votes)`;
                        }
                    });
                }
            }
        });
        
        socket.on("live_tally", tally => {
            const el = document.getElementById("liveStandings");
            if (!el) return;
            el.innerHTML = `<div class="standing-item">Votes: <span>${tally.count}</span></div>`;
        });
    </script>
    <script src="/genbar.js"></script>
</body>
</html>
