<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AIMAP - Admin Console</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; text-align: left; }
        .stat-card { background: rgba(255,255,255,0.05); padding: 1.5rem; border-radius: 16px; }
        .btn-red { background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%); color: white; }
    </style>
</head>
<body>
    <div class="dots"></div>
    <div class="login-container" style="max-width: 800px;">
        <h1>AIMAP ADMIN</h1>
        
        <div class="admin-grid">
            <div class="stat-card">
                <h3>Control Phase</h3>
                <label>Select Session Mode</label>
                <select id="modeSelect">
                    <option value="audio">Audio Parameters</option>
                    <option value="visual">Visual Parameters</option>
                    <option value="both" selected>Both (Full Session)</option>
                </select>
                <button onclick="sendCommand('start_vote')" style="margin-top: 1rem;">START SESSION</button>
                <button onclick="sendCommand('lock_and_average')" style="margin-top: 1rem; background: var(--secondary-color);">LOCK & SHOW RESULTS</button>
                <button onclick="sendCommand('reset')" class="btn-red" style="margin-top: 1rem;">RESET ALL</button>
            </div>

            <div class="stat-card">
                <h3>Live Status</h3>
                <p>Submissions: <span id="subCount" style="color: var(--primary-color); font-size: 2rem; font-weight: 800;">0</span></p>
                <p>Status: <span id="statusText" style="color: var(--secondary-color);">Lobby</span></p>
                <div id="recentLog" style="font-size: 0.8rem; color: rgba(255,255,255,0.4); margin-top: 1rem;"></div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        function sendCommand(cmd) {
            const mode = document.getElementById('modeSelect').value;
            socket.emit('admin_command', { command: cmd, mode: mode });
        }

        socket.on("aggregator_update", data => {
            document.getElementById('subCount').textContent = data.count;
            const log = document.getElementById('recentLog');
            log.innerHTML = `<div>${data.recentUser} joined</div>` + log.innerHTML;
        });

        socket.on("phase_change", state => {
            document.getElementById('statusText').textContent = state.phase.toUpperCase();
        });
    </script>
</body>
</html>
