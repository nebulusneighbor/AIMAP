<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AIMAP - Aggregator View</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .result-box { display: none; animation: fadeIn 1s ease; }
        .big-number { font-size: 3.5rem; font-weight: 900; color: var(--primary-color); text-shadow: var(--accent-glow); }
        .live-user-feed { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; margin-top: 2rem; max-height: 200px; overflow-y: hidden; }
        .user-tag { background: rgba(0, 242, 254, 0.15); border: 1px solid var(--primary-color); padding: 0.5rem 1rem; border-radius: 20px; font-size: 0.9rem; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .results-grid-detailed { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1.2rem; text-align: left; }
        .detail-card { background: rgba(255,255,255,0.03); padding: 1rem; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .detail-card h4 { color: var(--secondary-color); font-size: 0.7rem; text-transform: uppercase; margin-bottom: 0.5rem; }
        .detail-val { font-size: 1.2rem; font-weight: 800; color: white; }
        .chart-container { position: relative; background: rgba(255,255,255,0.02); padding: 2rem 1rem; border-radius: 16px; margin: 1.5rem 0; display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap; }
        .threshold-line { position: absolute; top: 20px; left: 0; width: 100%; height: 60px; border-bottom: 2px dashed rgba(244, 63, 94, 0.5); pointer-events: none; z-index: 1; }
        .threshold-label { position: absolute; right: 10px; top: 65px; color: #f43f5e; font-size: 0.6rem; font-weight: 800; text-transform: uppercase; }
        .bar-wrap { text-align: center; min-width: 90px; position: relative; z-index: 2; }
        .bar-bg { height: 100px; width: 35px; background: rgba(255,255,255,0.05); border-radius: 6px; position: relative; margin: auto; overflow: hidden; }
        .bar-fill { position: absolute; bottom: 0; width: 100%; background: var(--primary-color); transition: height 1.5s ease; }
        .included-tag { font-size: 0.55rem; color: #10b981; font-weight: 900; margin-top: 5px; opacity: 0; transition: opacity 1s 1.5s; }
        .mode-section { display: none; margin-top: 2rem; }
    </style>
</head>
<body>
    <div class="dots"></div>
    <div class="login-container" style="max-width: 1100px; padding: 3rem;">
        
        <div id="waitingState">
            <h1 id="headerText">WAITING FOR AUDIENCE</h1>
            <div id="counter" class="big-number" style="font-size: 8rem;">0</div>
            <p style="letter-spacing: 0.3em; opacity: 0.6; margin-bottom: 2rem;">SUBMISSIONS RECEIVED</p>
            <div id="userFeed" class="live-user-feed"></div>
        </div>

        <div id="resultsView" class="result-box">
            <h1 style="font-size: 4rem; margin-bottom: 2rem; color: var(--primary-color);">FINAL RESULTS</h1>
            
            <!-- SHARED AUDIO RESULTS (Used in 'audio' and 'both') -->
            <div id="audioResults" class="mode-section">
                <div class="results-grid-detailed">
                    <div class="detail-card"><h4>Top Feel</h4><div id="resGenre" class="detail-val">--</div></div>
                    <div class="detail-card"><h4>Musical Mode</h4><div id="resMode" class="detail-val">--</div></div>
                    <div class="detail-card"><h4>Avg Tempo</h4><div id="resTempo" class="detail-val">--</div></div>
                    <div class="detail-card"><h4>Human Guitar</h4><div id="resHumanTone" class="detail-val">--</div></div>
                </div>
                <h3 style="margin-top: 2.5rem; text-align: left;">Avatar Instrument Mix (50% Threshold)</h3>
                <div class="chart-container">
                    <div class="threshold-line"></div><div class="threshold-label">Included &uarr;</div>
                    <div id="resInstruments" style="display: contents;"></div>
                </div>
            </div>

            <!-- SHARED VISUAL RESULTS (Used in 'visual' and 'both') -->
            <div id="visualResults" class="mode-section">
                <div class="results-grid-detailed" style="margin-bottom: 1.5rem;">
                    <div class="detail-card"><h4>Environment</h4><div id="resEnv" class="detail-val">--</div></div>
                </div>
                <div class="grid-2" style="gap: 2rem;">
                    <div class="detail-card">
                        <h4>Dancer Configurations</h4>
                        <div style="font-size: 0.9rem; line-height: 1.6;">
                            <div style="margin-bottom: 1rem;"><b style="color: var(--primary-color);">Dancer 1:</b><br><span id="resD1"></span></div>
                            <div><b style="color: var(--primary-color);">Dancer 2:</b><br><span id="resD2"></span></div>
                        </div>
                    </div>
                    <div class="detail-card">
                        <h4>Band Avatar Species</h4>
                        <div id="resBandSpecies" class="detail-val" style="margin-bottom: 0.8rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.5rem;">--</div>
                        <div id="resBandMembers" style="font-size: 0.75rem; line-height: 1.5; display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        socket.on("aggregator_update", data => {
            document.getElementById('counter').textContent = data.count;
            if (data.username) {
                const feed = document.getElementById('userFeed');
                const tag = document.createElement('div');
                tag.className = 'user-tag';
                tag.textContent = data.username;
                feed.prepend(tag);
            }
        });

        socket.on("aggregator_reset", () => {
            document.getElementById('waitingState').style.display = 'block';
            document.getElementById('resultsView').style.display = 'none';
            document.querySelectorAll('.mode-section').forEach(s => s.style.display = 'none');
            document.getElementById('counter').textContent = '0';
            document.getElementById('userFeed').innerHTML = '';
        });

        socket.on("results_ready", r => {
            if (!r) return;
            document.getElementById('waitingState').style.display = 'none';
            document.getElementById('resultsView').style.display = 'block';

            // Show relevant sections
            if (r.mode === 'audio' || r.mode === 'both') document.getElementById('audioResults').style.display = 'block';
            if (r.mode === 'visual' || r.mode === 'both') document.getElementById('visualResults').style.display = 'block';

            // Audio Map
            if (r.genre) {
                document.getElementById('resGenre').textContent = r.genre;
                document.getElementById('resMode').textContent = r.mode_val || r.mode; // Adjusted key to avoid conflict
                document.getElementById('resTempo').textContent = r.tempo + " BPM";
                document.getElementById('resHumanTone').textContent = "Tone " + r.humanGuitarTone;

                const instDiv = document.getElementById('resInstruments');
                instDiv.innerHTML = '';
                for (let [name, count] of Object.entries(r.instruments)) {
                    const pct = Math.round((count / r.count) * 100) || 0;
                    const included = pct >= 50;
                    const fx = r.topFX[name] || "1";
                    instDiv.innerHTML += `
                        <div class="bar-wrap">
                            <div style="font-size: 0.6rem; color: var(--secondary-color); font-weight: 800; margin-bottom: 5px;">FX ${fx}</div>
                            <div class="bar-bg"><div class="bar-fill" style="height: ${pct}%; background: ${included ? 'var(--primary-color)' : 'rgba(255,255,255,0.2)'}"></div></div>
                            <p style="font-size: 0.65rem; text-transform: uppercase; margin-top: 8px; font-weight: 700;">${name}</p>
                            <div class="included-tag" style="opacity: ${included ? 1 : 0}">INCLUDED</div>
                        </div>`;
                }
            }

            // Visual Map
            if (r.environment) {
                document.getElementById('resEnv').textContent = r.environment;
                document.getElementById('resD1').textContent = `${r.dancers.d1.char.replace(/_/g, ' ')} performing ${r.dancers.d1.move}`;
                document.getElementById('resD2').textContent = `${r.dancers.d2.char.replace(/_/g, ' ')} performing ${r.dancers.d2.move}`;
                
                const bMem = document.getElementById('resBandMembers');
                bMem.innerHTML = '';
                for (let [m, char] of Object.entries(r.band.members)) {
                    bMem.innerHTML += `<div><b style="color: var(--secondary-color)">${m}:</b> ${char.replace(/_/g, ' ')}</div>`;
                }
            }
        });
    </script>
</body>
</html>
