<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AIMAP - Audio Mode</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="dots"></div>
    <div class="login-container">
        <h1>Musical Parameters</h1>
        <form method="POST" action="/submit">
            <div class="input-group">
                <h3>Musical Feel</h3>
                <select name="genre">
                    <option value="" selected>Select Feel</option>
                    <option value="drive/rock">Drive / Rock</option>
                    <option value="pulse/hiphop">Pulse / Electronic / HipHop</option>
                    <option value="groove/funky">Groove / Funky</option>
                    <option value="elegant/atmospheric">Elegant / Atmos</option>
                </select>
            </div>

            <div class="grid-2">
                <div class="input-group">
                    <h3>Musical Mode</h3>
                    <select name="mode">
                        <option value="" disabled selected>Select Mode</option>
                        <option value="major">Major</option>
                        <option value="minor">Minor</option>
                    </select>
                </div>
                <div class="input-group">
                    <h3>Tempo</h3>
                    <label>Current: <span id="tempoValue" style="color: var(--primary-color); font-weight: 800;">115</span> BPM</label>
                    <input type="range" id="tempo" name="tempo" min="90" max="140" value="115">
                </div>
            </div>

            <div class="stat-card" style="padding: 1rem; background: rgba(0, 242, 254, 0.05); border: 1px solid var(--primary-color); margin-bottom: 2rem;">
                <h3 style="margin-top: 0; color: var(--primary-color);">Human Guitarist</h3>
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <span class="option-tag" style="margin: 0;">Set Human Guitar Tone</span>
                    <div class="param-bubble">
                        <select name="human_guitar_tone">
                            <option value="" selected>Select Tone</option>
                            <option value="1">Clean as a whistle</option>
                            <option value="2">Raging solo lead</option>
                            <option value="3">Ethereal fuzz</option>
                        </select>
                    </div>
                </div>
            </div>

            <h3>Which avatar instruments?</h3>

            <div class="instrument-row">
                <div class="instrument-main"><span class="option-tag">Avatar Guitar</span>
                    <select name="guitar_include" class="inst-include-sel">
                        <option value="" selected>Select Inclusion</option>
                        <option value="yes">Include Guitar</option>
                        <option value="no">Exclude</option>
                    </select>
                </div>
                <div class="param-bubble">
                    <select name="guitar_fx_choice">
                        <option value="" selected>Select FX</option>
                        <option value="default">Default</option>
                        <option value="dist">Distortion</option>
                        <option value="airy">Airy Chorus</option>
                    </select>
                </div>
            </div>
            <div class="instrument-row">
                <div class="instrument-main"><span class="option-tag">Bass</span>
                    <select name="bass_include" class="inst-include-sel">
                        <option value="" selected>Select Inclusion</option>
                        <option value="yes">Include Bass</option>
                        <option value="no">Exclude</option>
                    </select>
                </div>
                <div class="param-bubble">
                    <select name="bass_fx_choice">
                        <option value="" selected>Select FX</option>
                        <option value="default">Default</option>
                        <option value="dist">Distortion</option>
                        <option value="reverb">Reverb</option>
                    </select>
                </div>
            </div>
            <div class="instrument-row">
                <div class="instrument-main"><span class="option-tag">Piano</span>
                    <select name="piano_include" class="inst-include-sel">
                        <option value="" selected>Select Inclusion</option>
                        <option value="yes">Include Piano</option>
                        <option value="no">Exclude</option>
                    </select>
                </div>
                <div class="param-bubble">
                    <select name="piano_fx_choice">
                        <option value="" selected>Select FX</option>
                        <option value="default">Default</option>
                        <option value="dist">Distortion</option>
                        <option value="echo">Echo</option>
                    </select>
                </div>
            </div>
            <div class="instrument-row">
                <div class="instrument-main"><span class="option-tag">Strings</span>
                    <select name="strings_include" class="inst-include-sel">
                        <option value="" selected>Select Inclusion</option>
                        <option value="yes">Include Strings</option>
                        <option value="no">Exclude</option>
                    </select>
                </div>
                <div class="param-bubble">
                    <select name="strings_fx_choice">
                        <option value="" selected>Select FX</option>
                        <option value="default">Default</option>
                        <option value="dist">Distortion</option>
                        <option value="chorus">Chorus</option>
                    </select>
                </div>
            </div>
            <div class="instrument-row" style="margin-bottom: 2rem;">
                <div class="instrument-main"><span class="option-tag">Winds / Flute</span>
                    <select name="winds_include" class="inst-include-sel">
                        <option value="" selected>Select Inclusion</option>
                        <option value="yes">Include Winds</option>
                        <option value="no">Exclude</option>
                    </select>
                </div>
                <div class="param-bubble">
                    <select name="winds_fx_choice">
                        <option value="" selected>Select FX</option>
                        <option value="default">Default</option>
                        <option value="dist">Distortion</option>
                        <option value="phaser">Phaser</option>
                    </select>
                </div>
            </div>

            <input type="hidden" name="instruments" id="instrumentHidden">
            <button type="submit">Lock In Parameters</button>
        </form>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        socket.on("redirect_clients", d => window.location.href = d.page);

        const tempo = document.getElementById("tempo");
        tempo.oninput = () => document.getElementById("tempoValue").textContent = tempo.value;

        const hidden = document.getElementById("instrumentHidden");
        function updateInstruments() {
            const data = {};
            ['guitar', 'bass', 'piano', 'strings', 'winds'].forEach(inst => {
                const val = document.querySelector(`select[name="${inst}_include"]`).value;
                if (val === "yes") data[inst] = true;
                else if (val === "no") data[inst] = false;
                // "" remains unmapped/undefined for AI fallback
            });
            hidden.value = JSON.stringify(data);
        }
        document.querySelectorAll(".inst-include-sel").forEach(s => s.onchange = updateInstruments);
    </script>
</body>
</html>
