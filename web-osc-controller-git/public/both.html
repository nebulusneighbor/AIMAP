<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AIMAP - Full Session</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .character-box { background: rgba(255,255,255,0.03); padding: 1rem; border-radius: 12px; margin-bottom: 0.8rem; border: 1px solid rgba(255,255,255,0.05); text-align: left; }
        .character-box h4 { font-size: 0.8rem; margin-bottom: 0.5rem; color: var(--primary-color); text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="dots"></div>
    <div class="login-container" style="max-width: 1000px;">
        <h1>Full Parameters</h1>
        <form method="POST" action="/submit">
            
            <div class="grid-2">
                <!-- LEFT COLUMN: MUSICAL -->
                <div>
                    <div class="grid-2">
                        <div class="input-group"><h3>Musical Feel</h3><select name="genre" required><option value="drive/rock">Drive / Rock</option><option value="pulse/hiphop">Pulse / HipHop</option><option value="groove/funky">Groove / Funky</option><option value="elegant/atmospheric">Elegant / Atmospheric</option></select></div>
                        <div class="input-group"><h3>Musical Mode</h3><select name="mode" required><option value="major">Major</option><option value="minor">Minor</option></select></div>
                    </div>

                    <h3>Tempo</h3>
                    <label>Current: <span id="tempoValue" style="color: var(--primary-color); font-weight: 800;">115</span> BPM</label>
                    <input type="range" id="tempo" name="tempo" min="90" max="140" value="115">

                    <div class="stat-card" style="padding: 0.8rem; background: rgba(0, 242, 254, 0.05); border: 1px solid var(--primary-color); margin: 1rem 0;">
                        <span class="option-tag">Set Human Guitar Tone</span>
                        <div class="param-bubble" style="margin-top:5px">Tone <select name="human_guitar_tone"><option>1</option><option>2</option><option>3</option></select></div>
                    </div>

                    <h3>Which avatar instruments?</h3>
                    <div style="font-size: 0.8rem;">
                        <div class="instrument-row"><div class="instrument-main"><label class="effect-label"><input type="checkbox" value="guitar"> Avatar Guitar</label></div><div class="param-bubble">FX <select name="guitar_fx"><option>1</option><option>2</option><option>3</option></select></div></div>
                        <div class="instrument-row"><div class="instrument-main"><label class="effect-label"><input type="checkbox" value="bass"> Bass</label></div><div class="param-bubble">FX <select name="bass_fx"><option>1</option><option>2</option><option>3</option></select></div></div>
                        <div class="instrument-row"><div class="instrument-main"><label class="effect-label"><input type="checkbox" value="piano"> Piano</label></div><div class="param-bubble">FX <select name="piano_fx"><option>1</option><option>2</option><option>3</option></select></div></div>
                        <div class="instrument-row"><div class="instrument-main"><label class="effect-label"><input type="checkbox" value="strings"> Strings</label></div><div class="param-bubble">FX <select name="strings_fx"><option>1</option><option>2</option><option>3</option></select></div></div>
                        <div class="instrument-row"><div class="instrument-main"><label class="effect-label"><input type="checkbox" value="winds"> Winds</label></div><div class="param-bubble">FX <select name="winds_fx"><option>1</option><option>2</option><option>3</option></select></div></div>
                        <input type="hidden" name="instruments" id="instrumentHidden">
                    </div>
                </div>

                <!-- RIGHT COLUMN: VISUAL -->
                <div>
                    <h3>Environment</h3>
                    <select name="environment"><option value="haunted forest">Haunted Forest</option><option value="mars scape">Mars Scape</option><option value="laser grid">Laser Grid</option></select>

                    <h3>Backup Dancers</h3>
                    <div class="character-box">
                        <h4>Dancer 1</h4>
                        <div class="dancer-config-group">
                            <div><span class="option-tag">Character</span><select name="d1_character" class="all-chars-sel"></select></div>
                            <div><span class="option-tag">Dance Move</span><select name="d1_move"><option value="hiphop">Hip Hop</option><option value="breakdance">Breakdance</option><option value="latin">Latin</option><option value="drink">1 Less Drink</option></select></div>
                        </div>
                    </div>
                    <div class="character-box">
                        <h4>Dancer 2</h4>
                        <div class="dancer-config-group">
                            <div><span class="option-tag">Character</span><select name="d2_character" class="all-chars-sel"></select></div>
                            <div><span class="option-tag">Dance Move</span><select name="d2_move"><option value="hiphop">Hip Hop</option><option value="breakdance">Breakdance</option><option value="latin">Latin</option><option value="drink">1 Less Drink</option></select></div>
                        </div>
                    </div>

                    <h3>Band Members</h3>
                    <div class="stat-card" style="padding: 1rem; background: rgba(255,255,255,0.03); border-radius: 12px;">
                        <span class="option-tag">Individual Characters</span>
                        <div style="margin-top: 1rem; font-size: 0.7rem; display: flex; flex-direction: column; gap: 4px;">
                            <div><label style="color:var(--primary-color)">Drum 1</label><select name="drum1_char" class="all-chars-sel"></select></div>
                            <div><label style="color:var(--primary-color)">Drum 2</label><select name="drum2_char" class="all-chars-sel"></select></div>
                            <div><label style="color:var(--primary-color)">Avatar Guitar</label><select name="guitar_char" class="all-chars-sel"></select></div>
                            <div><label style="color:var(--primary-color)">Bass</label><select name="bass_char" class="all-chars-sel"></select></div>
                            <div><label style="color:var(--primary-color)">Piano</label><select name="piano_char" class="all-chars-sel"></select></div>
                            <div><label style="color:var(--primary-color)">Strings</label><select name="strings_char" class="all-chars-sel"></select></div>
                            <div><label style="color:var(--primary-color)">Winds</label><select name="winds_char" class="all-chars-sel"></select></div>
                        </div>
                    </div>
                </div>
            </div>

            <button type="submit" style="margin-top: 2rem;">Lock In All Parameters</button>
        </form>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        socket.on("redirect_clients", d => window.location.href = d.page);
        const tempo = document.getElementById("tempo");
        tempo.oninput = () => document.getElementById("tempoValue").textContent = tempo.value;

        const allCharacters = [
            { group: "Monsters", members: ["Vampire", "Werewolf", "Moose Orc", "Goblin Elf"] },
            { group: "Aliens", members: ["Flesh Eater", "Dark Noire", "Lizard Species", "Webbed and Armored"] },
            { group: "Robots", members: ["X-Bot", "Y-Bot"] }
        ];

        function populateSelects() {
            const selects = document.querySelectorAll(".all-chars-sel");
            let html = "";
            allCharacters.forEach(g => {
                html += `<optgroup label="${g.group}">`;
                g.members.forEach(m => {
                    html += `<option value="${m.toLowerCase().replace(/ /g, '_')}">${m}</option>`;
                });
                html += `</optgroup>`;
            });
            selects.forEach(s => s.innerHTML = html);
        }

        const hidden = document.getElementById("instrumentHidden");
        function updateInstruments() { const data = {}; ['guitar', 'bass', 'piano', 'strings', 'winds'].forEach(inst => { if (document.querySelector(`input[value="${inst}"]`).checked) data[inst] = true; }); hidden.value = JSON.stringify(data); }
        document.querySelectorAll("input[type=checkbox]").forEach(cb => cb.onchange = updateInstruments);

        populateSelects();
    </script>
</body>
</html>
