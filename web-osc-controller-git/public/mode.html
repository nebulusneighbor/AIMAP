<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIMAP - Select Mode</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dots"></div>
    <div class="login-container">
        <h1>Select Mode</h1>
        <form method="POST" action="/set-mode">
            <div class="mode-grid">
                <button type="submit" name="mode" value="audio" class="mode-card">
                    <span style="font-size: 2rem;">🎵</span>
                    Audio
                </button>
                <button type="submit" name="mode" value="visual" class="mode-card">
                    <span style="font-size: 2rem;">🎨</span>
                    Visual
                </button>
                <button type="submit" name="mode" value="both" class="mode-card">
                    <span style="font-size: 2rem;">⚡</span>
                    Both
                </button>
            </div>
        </form>
    </div>
</body>
</html>
