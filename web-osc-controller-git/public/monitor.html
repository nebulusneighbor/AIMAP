<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Aggregator Monitor</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #121212; 
            color: #ffffff; 
            margin: 0; 
            padding: 40px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        .dashboard {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }
        .counter-box {
            background: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            border: 2px solid #333;
            margin-bottom: 30px;
        }
        .counter-box h2 { margin-top: 0; color: #aaaaaa; }
        .big-number {
            font-size: 6rem;
            font-weight: bold;
            color: #00ff9d; /* Neon green */
            margin: 0;
            line-height: 1;
        }
        .log-box {
            background: #000000;
            border: 1px solid #333;
            border-radius: 8px;
            height: 300px;
            overflow-y: auto;
            padding: 20px;
            text-align: left;
            font-family: monospace;
            color: #00ff9d;
        }
        .log-entry { margin-bottom: 8px; border-bottom: 1px solid #222; padding-bottom: 4px; }
        .timestamp { color: #888; font-size: 0.8em; margin-right: 10px; }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="counter-box">
            <h2>TOTAL INTERACTIONS</h2>
            <p class="big-number" id="global-count">0</p>
        </div>

        <div class="log-box" id="live-log">
            <div class="log-entry" style="color: #aaa;">Listening for incoming connections...</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io(); // Connects to your local server

        const countDisplay = document.getElementById('global-count');
        const liveLog = document.getElementById('live-log');

        // Listen for the exact same broadcast the main page uses
        socket.on('aggregator_update', (data) => {
            // 1. Update the big number
            countDisplay.innerText = data.count;
            
            // 2. Add a formatted log entry
            const time = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            logEntry.innerHTML = `<span class="timestamp">[${time}]</span> ${data.message}`;
            
            liveLog.appendChild(logEntry);
            
            // 3. Auto-scroll to the newest message
            liveLog.scrollTop = liveLog.scrollHeight;
        });
    </script>
</body>
</html>
