<html>

<body style="background:black;color:white;font-family:Arial;text-align:center;">

<h1>Submit Track</h1>

<p id="updateMessage" style="color:#00ff88; display:none;">
Submission Updated
</p>

<form method="POST" action="/submit">

<label>Genre</label>

<br><br>

<input type="text" name="genre" required>

<br><br>

<label>Tempo: <span id="tempoValue">80</span></label>

<br>

<input type="range" id="tempo" name="tempo" min="80" max="180" value="80">

<br><br>

<label>Color</label>

<br>

<input type="range" id="color" name="color" min="0" max="360" value="0">

<div id="colorDisplay"
style="
width:100px;
height:100px;
margin:20px auto;
border-radius:8px;
background:hsl(0,100%,50%);
">
</div>

<br>

<label>Instruments</label>

<br><br>

<label>
<input type="checkbox" value="guitar" class="instrumentCheck">
Guitar
</label>

<br>

<label>
<input type="checkbox" value="bass" class="instrumentCheck">
Bass
</label>

<br>

<label>
<input type="checkbox" value="strings" class="instrumentCheck">
Strings
</label>

<br>

<label>
<input type="checkbox" value="piano" class="instrumentCheck">
Piano
</label>

<input type="hidden" name="instruments" id="instrumentHidden">

<br><br>

<button type="submit">Submit Track</button>

</form>

<script>

/* ---------------- Tempo Display ---------------- */

const tempoSlider = document.getElementById("tempo");
const tempoValue = document.getElementById("tempoValue");

tempoSlider.oninput = () => {
    tempoValue.textContent = tempoSlider.value;
};

/* ---------------- Color Preview ---------------- */

const colorSlider = document.getElementById("color");
const colorDisplay = document.getElementById("colorDisplay");

colorSlider.oninput = () => {

    const hue = colorSlider.value;

    colorDisplay.style.backgroundColor =
        "hsl(" + hue + ",100%,50%)";

};

/* ---------------- Instruments ---------------- */

const checks = document.querySelectorAll(".instrumentCheck");
const hidden = document.getElementById("instrumentHidden");

function updateInstruments(){

let selected = [];

checks.forEach(box => {

    if(box.checked){
        selected.push(box.value);
    }

});

hidden.value = selected.join(",");

}

checks.forEach(box => {
    box.addEventListener("change", updateInstruments);
});

/* ---------------- Submission Updated Message ---------------- */

const params = new URLSearchParams(window.location.search);

if(params.get("submitted") === "true"){

const msg = document.getElementById("updateMessage");

msg.style.display = "block";

setTimeout(() => {

msg.style.display = "none";

},3000);

}

</script>

</body>

</html>
